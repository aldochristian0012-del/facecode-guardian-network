[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -v
    --tb=short
    --strict-markers
    --disable-warnings
    --cov=facecode_guardian
    --cov-report=html
    --cov-report=term-missing
    --cov-report=xml

markers =
    unit: Tests unitarios
    integration: Tests de integración
    ethical: Tests de cumplimiento ético
    slow: Tests que toman tiempo
    requires_gpu: Tests que requieren GPU

filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning

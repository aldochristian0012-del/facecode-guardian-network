[tool.poetry]
name = "facecode-guardian-network"
version = "0.1.0"
description = "Sistema de reconocimiento facial ético con cumplimiento del AI Act de la UE"
authors = ["Christian - Fundador de FaceCode® <contact@facecode.com>"]
license = "Ethical FaceCode License v1.0"
readme = "README.md"
homepage = "https://github.com/facecode/guardian-network"
repository = "https://github.com/facecode/guardian-network"
keywords = ["facial-recognition", "ethics", "ai-act", "gdpr", "bias-detection"]

[tool.poetry.dependencies]
python = "^3.9"
fastapi = "^0.109.0"
uvicorn = {extras = ["standard"], version = "^0.27.0"}
pydantic = "^2.5.3"
pydantic-settings = "^2.1.0"
mediapipe = "^0.10.9"
opencv-python = "^4.9.0"
pillow = "^10.2.0"
numpy = "^1.26.3"
httpx = "^0.26.0"
python-multipart = "^0.0.6"
python-json-logger = "^2.0.7"
gunicorn = "^21.2.0"
python-dotenv = "^1.0.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.4"
pytest-asyncio = "^0.23.3"
pytest-cov = "^4.1.0"
black = "^24.1.1"
flake8 = "^7.0.0"
mypy = "^1.8.0"

[tool.poetry.scripts]
facecode-guardian = "facecode_guardian.main:run_server"

[tool.black]
line-length = 100
target-version = ['py39']
include = '\.pyi?$'

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "-v --cov=facecode_guardian --cov-report=html --cov-report=term"

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

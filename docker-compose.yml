version: '3.8'

services:
  facecode-guardian:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: facecode-guardian-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DEBUG=false
      - HOST=0.0.0.0
      - PORT=8000
      - WORKERS=4
      - REQUIRE_HUMAN_APPROVAL=true
      - ENABLE_BIAS_DETECTION=true
      - ENABLE_AUDIT_LOG=true
      - GDPR_COMPLIANT=true
      - EU_AI_ACT_COMPLIANT=true
      - EAA_COMPLIANT=true
    volumes:
      - ./logs:/app/logs
      - ./src:/app/src:ro
    networks:
      - facecode-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Opcional: Prometheus para monitoreo
  # prometheus:
  #   image: prom/prometheus:latest
  #   container_name: facecode-prometheus
  #   restart: unless-stopped
  #   ports:
  #     - "9090:9090"
  #   volumes:
  #     - ./deployment/prometheus.yml:/etc/prometheus/prometheus.yml
  #     - prometheus-data:/prometheus
  #   networks:
  #     - facecode-network

  # Opcional: Grafana para visualización
  # grafana:
  #   image: grafana/grafana:latest
  #   container_name: facecode-grafana
  #   restart: unless-stopped
  #   ports:
  #     - "3000:3000"
  #   volumes:
  #     - grafana-data:/var/lib/grafana
  #   networks:
  #     - facecode-network

networks:
  facecode-network:
    driver: bridge

volumes:
  prometheus-data:
  grafana-data:
